<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目时间线 · 本地模板</title><meta name="description" content="无数据的项目树与甘特时间线模板"><script src="theme.js"></script><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body>
<header class="topbar"><a class="brand" href="/" aria-label="项目时间线"><span class="brand-mark">t</span><strong>项目</strong><span class="slash">/</span><span>时间线</span></a><div class="account"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" title="切换到深色模式"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.8 12.3A7.2 7.2 0 0 1 7.7 3.2a7.2 7.2 0 1 0 9.1 9.1Z"></path></svg><span>深色</span></button><span class="org">本地模板</span><span id="user">本地用户</span></div></header>
<main><section class="heading"><div><div class="eyebrow">WORKSPACE</div><h1>所有项目<span id="count">0 个项目 · 0 个任务</span></h1></div><div class="heading-actions"><span id="sync" role="status">已保存 · 本地</span><button id="refresh" class="icon-button" title="刷新数据" aria-label="刷新数据">↻</button><button id="new-project" class="primary">＋ 新建项目</button></div></section>
<section class="toolbar"><div class="toolbar-group"><button id="expand">展开全部</button><button id="collapse">收起项目</button><span class="separator"></span><label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" fill="none"></circle><path d="M10 10l4 4" stroke="currentColor"></path></svg><input id="search" placeholder="查找项目或任务" aria-label="查找项目或任务"></label></div><div class="toolbar-group"><button id="prev" aria-label="上一段日期">‹</button><button id="today">今天</button><button id="next" aria-label="下一段日期">›</button><select id="zoom" aria-label="时间刻度"><option value="34">日视图</option><option value="18">周视图</option><option value="8">月视图</option></select></div></section>
<section id="board" aria-label="项目甘特图"></section><section class="legend"><span><i class="baseline-key"></i>原计划</span><span><i class="delay-key"></i>延期来源</span><button id="show-history">变更记录</button></section><section id="overview"><span class="overview-title">项目概览</span><div class="overview-items"></div></section></main><div id="toast" role="alert" hidden></div>
<dialog id="editor"><form id="edit-form"><header><span id="editor-type">任务详情</span><button type="button" id="close-editor" class="icon-button" aria-label="关闭">×</button></header><div id="editor-content"></div><footer><button type="button" id="cancel-editor">取消</button><button type="submit" class="primary" id="save">保存</button></footer></form></dialog>
<dialog id="history-dialog"><header><strong>变更记录</strong><button id="close-history" class="icon-button" aria-label="关闭变更记录">×</button></header><div id="history-content"></div></dialog></body></html>
